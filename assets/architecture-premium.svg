<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F8FAFC"/>
    <stop offset="0.52" stop-color="#F5F3FF"/>
    <stop offset="1" stop-color="#ECFEFF"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7C3AED"/>
    <stop offset="0.5" stop-color="#3B82F6"/>
    <stop offset="1" stop-color="#06B6D4"/>
  </linearGradient>
  <linearGradient id="accentSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#EDE9FE"/>
    <stop offset="1" stop-color="#CFFAFE"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#64748B" flood-opacity=".18"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1400" height="560" rx="36" fill="url(#bg)"/>

<text x="700" y="48" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#111827">System Architecture</text>

<g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
  <rect x="100" y="90" width="1200" height="64" rx="22" fill="#FFFFFF"/>
  <rect x="100" y="175" width="1200" height="64" rx="22" fill="#FFFFFF"/>
  <rect x="100" y="260" width="1200" height="64" rx="22" fill="#FFFFFF"/>
  <rect x="100" y="345" width="1200" height="64" rx="22" fill="#FFFFFF"/>
  <rect x="100" y="430" width="1200" height="64" rx="22" fill="#FFFFFF"/>
</g>

<g font-family="Inter,Arial,sans-serif">
  <text x="135" y="129" font-size="17" font-weight="800" fill="#7C3AED">01</text>
  <text x="180" y="129" font-size="18" font-weight="800" fill="#111827">Experience Layer</text>
  <text x="440" y="129" font-size="15" fill="#64748B">Desktop · Mobile · Web · Chat · Voice · Command UI</text>

  <text x="135" y="214" font-size="17" font-weight="800" fill="#6366F1">02</text>
  <text x="180" y="214" font-size="18" font-weight="800" fill="#111827">Intent & Orchestration</text>
  <text x="440" y="214" font-size="15" fill="#64748B">Understanding · Planning · Routing · Workflow · Recovery</text>

  <text x="135" y="299" font-size="17" font-weight="800" fill="#3B82F6">03</text>
  <text x="180" y="299" font-size="18" font-weight="800" fill="#111827">Permission & Security</text>
  <text x="440" y="299" font-size="15" fill="#64748B">Identity · Approval · Policies · Secrets · Audit</text>

  <text x="135" y="384" font-size="17" font-weight="800" fill="#0891B2">04</text>
  <text x="180" y="384" font-size="18" font-weight="800" fill="#111827">Agent Runtime & Mesh</text>
  <text x="440" y="384" font-size="15" fill="#64748B">Browser · Desktop · Terminal · Mobile · Cloud · P2P</text>

  <text x="135" y="469" font-size="17" font-weight="800" fill="#0F766E">05</text>
  <text x="180" y="469" font-size="18" font-weight="800" fill="#111827">Execution & Verification</text>
  <text x="440" y="469" font-size="15" fill="#64748B">Apps · Files · APIs · Devices · Evidence · Results</text>
</g>

<rect x="1080" y="103" width="170" height="38" rx="12" fill="#F5F3FF"/>
<rect x="1080" y="188" width="170" height="38" rx="12" fill="#EEF2FF"/>
<rect x="1080" y="273" width="170" height="38" rx="12" fill="#EFF6FF"/>
<rect x="1080" y="358" width="170" height="38" rx="12" fill="#ECFEFF"/>
<rect x="1080" y="443" width="170" height="38" rx="12" fill="#F0FDFA"/>

<g font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle">
  <text x="1165" y="128" fill="#6D28D9">USER EXPERIENCE</text>
  <text x="1165" y="213" fill="#4F46E5">AI CONTROL</text>
  <text x="1165" y="298" fill="#2563EB">ZERO TRUST</text>
