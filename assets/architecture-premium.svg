  <text x="1165" y="468" fill="#0F766E">VERIFIABLE</text>
</g>

<circle cx="75" cy="122" r="7" fill="#7C3AED" filter="url(#glow)">
  <animate attributeName="cy" values="122;462;122" dur="5s" repeatCount="indefinite"/>
</circle>

</svg>