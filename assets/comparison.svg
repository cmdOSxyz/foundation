<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F8FAFC"/>
    <stop offset="0.52" stop-color="#F5F3FF"/>
    <stop offset="1" stop-color="#ECFEFF"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7C3AED"/>
    <stop offset="0.5" stop-color="#3B82F6"/>
    <stop offset="1" stop-color="#06B6D4"/>
  </linearGradient>
  <linearGradient id="accentSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#EDE9FE"/>
    <stop offset="1" stop-color="#CFFAFE"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#64748B" flood-opacity=".18"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1400" height="520" rx="36" fill="url(#bg)"/>

<text x="700" y="48" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#111827">From answers to execution</text>

<g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
  <rect x="90" y="100" width="360" height="350" rx="30" fill="#FFFFFF"/>
  <rect x="520" y="100" width="360" height="350" rx="30" fill="#FFFFFF"/>
  <rect x="950" y="100" width="360" height="350" rx="30" fill="url(#accent)"/>
</g>

<g font-family="Inter,Arial,sans-serif">
  <text x="130" y="155" font-size="20" font-weight="800" fill="#111827">Traditional Chat AI</text>
  <text x="560" y="155" font-size="20" font-weight="800" fill="#111827">Automation Tools</text>
  <text x="990" y="155" font-size="20" font-weight="800" fill="#FFFFFF">cmdOS</text>

  <text x="130" y="205" font-size="15" fill="#64748B">✓ Answers questions</text>
  <text x="130" y="245" font-size="15" fill="#64748B">✓ Generates content</text>
  <text x="130" y="285" font-size="15" fill="#94A3B8">— Limited real execution</text>
  <text x="130" y="325" font-size="15" fill="#94A3B8">— Weak permissions</text>
  <text x="130" y="365" font-size="15" fill="#94A3B8">— No verification loop</text>

  <text x="560" y="205" font-size="15" fill="#64748B">✓ Executes fixed flows</text>
  <text x="560" y="245" font-size="15" fill="#64748B">✓ Connects apps</text>
  <text x="560" y="285" font-size="15" fill="#94A3B8">— Manual setup</text>
  <text x="560" y="325" font-size="15" fill="#94A3B8">— Limited reasoning</text>
  <text x="560" y="365" font-size="15" fill="#94A3B8">— Fragile workflows</text>

  <text x="990" y="205" font-size="15" fill="#FFFFFF">✓ Understands intent</text>
  <text x="990" y="245" font-size="15" fill="#FFFFFF">✓ Plans dynamically</text>
  <text x="990" y="285" font-size="15" fill="#FFFFFF">✓ Requests permission</text>
  <text x="990" y="325" font-size="15" fill="#FFFFFF">✓ Executes across tools</text>
  <text x="990" y="365" font-size="15" fill="#FFFFFF">✓ Verifies the result</text>
</g>

<circle r="7" fill="#FFFFFF" filter="url(#glow)">
  <animateMotion dur="4s" repeatCount="indefinite" path="M980 405 C1060 455, 1210 455, 1280 405"/>
</circle>

</svg>