<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05070b"/>
    <stop offset=".55" stop-color="#0a0e18"/>
    <stop offset="1" stop-color="#07141a"/>
  </linearGradient>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#171c28"/>
    <stop offset="1" stop-color="#0d111a"/>
  </linearGradient>
  <linearGradient id="surface2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#202736"/>
    <stop offset="1" stop-color="#111722"/>
  </linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9f7aea"/>
    <stop offset=".5" stop-color="#5da8ff"/>
    <stop offset="1" stop-color="#2dd4bf"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fafc"/>
    <stop offset=".25" stop-color="#64748b"/>
    <stop offset=".52" stop-color="#ffffff"/>
    <stop offset=".78" stop-color="#334155"/>
    <stop offset="1" stop-color="#cbd5e1"/>
  </linearGradient>
  <radialGradient id="orb">
    <stop offset="0" stop-color="#7c3aed" stop-opacity=".28"/>
    <stop offset=".55" stop-color="#38bdf8" stop-opacity=".10"/>
    <stop offset="1" stop-color="#05070b" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-80%" y="-80%" width="260%" height="260%">
    <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity=".62"/>
  </filter>
  <filter id="smallShadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity=".48"/>
  </filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1440" height="700" rx="34" fill="url(#bg)"/>

<text x="72" y="62" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="350" fill="#ffffff">cmdOS connect</text>
<text x="72" y="94" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="300" fill="#8f9bad">human conversations and agent execution in the same operational context</text>
<line x1="72" y1="118" x2="1368" y2="118" stroke="#ffffff" stroke-opacity=".08"/>

