<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F8FAFC"/>
    <stop offset="1" stop-color="#EEF2FF"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7C3AED"/>
    <stop offset="0.5" stop-color="#3B82F6"/>
    <stop offset="1" stop-color="#06B6D4"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#64748B" flood-opacity=".20"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1400" height="440" rx="36" fill="url(#bg)"/>

<circle cx="120" cy="80" r="170" fill="#C4B5FD" opacity=".28"/>
<circle cx="1280" cy="330" r="220" fill="#67E8F9" opacity=".24"/>
<g opacity=".55">
  <circle cx="180" cy="320" r="7" fill="#8B5CF6"><animate attributeName="cy" values="320;290;320" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="1220" cy="100" r="9" fill="#06B6D4"><animate attributeName="cy" values="100;130;100" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="1150" cy="330" r="5" fill="#3B82F6"><animate attributeName="cx" values="1150;1180;1150" dur="3.5s" repeatCount="indefinite"/></circle>
</g>
<g filter="url(#shadow)">
  <rect x="380" y="68" width="640" height="286" rx="34" fill="#FFFFFF" opacity=".88"/>
  <rect x="381" y="69" width="638" height="284" rx="33" fill="none" stroke="#FFFFFF"/>
</g>
<g transform="translate(700 180)">
  <polygon points="-88,-50 0,-98 88,-50 88,50 0,98 -88,50" fill="url(#accent)" opacity=".96" filter="url(#shadow)"/>
  <polygon points="-56,-32 0,-62 56,-32 56,32 0,62 -56,32" fill="#FFFFFF" opacity=".92"/>
  <text x="0" y="12" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="56" font-weight="700" fill="#111827">cmd</text>
</g>
<text x="700" y="310" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#334155">THE AI EXECUTION OPERATING SYSTEM</text>
<path d="M455 360 C560 405, 840 405, 945 360" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity=".55"/>
<circle r="7" fill="#7C3AED" filter="url(#glow)">
  <animateMotion dur="4s" repeatCount="indefinite" path="M455 360 C560 405, 840 405, 945 360"/>
</circle>

</svg>