<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F8FAFC"/>
    <stop offset="1" stop-color="#EEF2FF"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7C3AED"/>
    <stop offset="0.5" stop-color="#3B82F6"/>
    <stop offset="1" stop-color="#06B6D4"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#64748B" flood-opacity=".20"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1400" height="430" rx="36" fill="url(#bg)"/>

<text x="700" y="45" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#111827">Secure Agent Mesh</text>
<g stroke="#CBD5E1" stroke-width="3">
<path d="M700 205L260 90M700 205L1140 90M700 205L260 330M700 205L1140 330M260 90L1140 90M260 330L1140 330"/>
</g>
<g filter="url(#shadow)">
<circle cx="700" cy="205" r="88" fill="url(#accent)"/>
<circle cx="260" cy="90" r="54" fill="#FFFFFF"/>
<circle cx="1140" cy="90" r="54" fill="#FFFFFF"/>
<circle cx="260" cy="330" r="54" fill="#FFFFFF"/>
<circle cx="1140" cy="330" r="54" fill="#FFFFFF"/>
</g>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle" font-weight="700">
<text x="700" y="212" font-size="24" fill="#FFFFFF">cmdOS Mesh</text>
<text x="260" y="96" font-size="17" fill="#111827">Phone</text>
<text x="1140" y="96" font-size="17" fill="#111827">Laptop</text>
<text x="260" y="336" font-size="17" fill="#111827">Desktop</text>
<text x="1140" y="336" font-size="17" fill="#111827">Server</text>
</g>
<circle r="8" fill="#7C3AED" filter="url(#glow)"><animateMotion dur="3.5s" repeatCount="indefinite" path="M700 205L260 90L1140 90L700 205"/></circle>
<circle r="8" fill="#06B6D4" filter="url(#glow)"><animateMotion dur="4.1s" begin=".7s" repeatCount="indefinite" path="M700 205L1140 330L260 330L700 205"/></circle>

</svg>