<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="330" viewBox="0 0 1400 330">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F8FAFC"/>
    <stop offset="1" stop-color="#EEF2FF"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7C3AED"/>
    <stop offset="0.5" stop-color="#3B82F6"/>
    <stop offset="1" stop-color="#06B6D4"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#64748B" flood-opacity=".20"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1400" height="330" rx="36" fill="url(#bg)"/>

<circle cx="180" cy="100" r="130" fill="#C4B5FD" opacity=".26"/>
<circle cx="1220" cy="200" r="150" fill="#67E8F9" opacity=".22"/>
<text x="700" y="140" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="800" fill="#111827">cmd<tspan fill="#7C3AED">OS</tspan></text>
<text x="700" y="190" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#475569">Building the AI Execution Operating System.</text>
<path d="M470 250 C590 300, 810 300, 930 250" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity=".6"/>
<circle r="7" fill="#7C3AED" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M470 250 C590 300, 810 300, 930 250"/></circle>

</svg>