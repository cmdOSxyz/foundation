  <rect x="26" y="237" width="216" height="28" rx="14" fill="#9f7aea" opacity=".12" stroke="#9f7aea" stroke-opacity=".18"/>
  <text x="134.0" y="256" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#9f7aea">preferred for sensitive tasks</text></g>
