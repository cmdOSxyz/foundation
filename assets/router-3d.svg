  <text x="26" y="215" font-family="Inter,Arial,sans-serif" font-size="11" fill="#778397">reliability</text>
  <rect x="26" y="225" width="308" height="8" rx="4" fill="#ffffff" opacity=".05"/>
  <rect x="26" y="225" width="277" height="8" rx="4" fill="#2dd4bf" opacity=".75"/>
  <rect x="26" y="237" width="150" height="28" rx="14" fill="#2dd4bf" opacity=".12" stroke="#2dd4bf" stroke-opacity=".18"/>
  <text x="101.0" y="256" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#2dd4bf">used when required</text></g>
