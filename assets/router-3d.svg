  <rect x="26" y="268" width="126" height="28" rx="14" fill="#5da8ff" opacity=".12" stroke="#5da8ff" stroke-opacity=".18"/>
  <text x="89.0" y="287" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#5da8ff">multi-provider</text></g>
<g transform="translate(1010 165) rotate(3 180.0 215.0)" filter="url(#shadow)">
  <rect x="14" y="20" width="360" height="430" rx="24" fill="#020305" opacity=".78"/>
  <rect x="7.0" y="7.0" width="360" height="430" rx="24" fill="#0b0f17" stroke="#2dd4bf" stroke-opacity=".16"/>
  <rect width="360" height="430" rx="24" fill="url(#surface)" stroke="#ffffff" stroke-opacity=".09"/>
  <path d="M24 30 H336" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
