<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05070b"/>
    <stop offset=".55" stop-color="#0a0e18"/>
    <stop offset="1" stop-color="#07141a"/>
  </linearGradient>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#171c28"/>
    <stop offset="1" stop-color="#0d111a"/>
  </linearGradient>
  <linearGradient id="surface2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#202736"/>
    <stop offset="1" stop-color="#111722"/>
  </linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9f7aea"/>
    <stop offset=".5" stop-color="#5da8ff"/>
    <stop offset="1" stop-color="#2dd4bf"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fafc"/>
    <stop offset=".25" stop-color="#64748b"/>
    <stop offset=".52" stop-color="#ffffff"/>
    <stop offset=".78" stop-color="#334155"/>
    <stop offset="1" stop-color="#cbd5e1"/>
  </linearGradient>
  <radialGradient id="orb">
    <stop offset="0" stop-color="#7c3aed" stop-opacity=".28"/>
    <stop offset=".55" stop-color="#38bdf8" stop-opacity=".10"/>
    <stop offset="1" stop-color="#05070b" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-80%" y="-80%" width="260%" height="260%">
    <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity=".62"/>
  </filter>
  <filter id="smallShadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity=".48"/>
  </filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1440" height="700" rx="34" fill="url(#bg)"/>

<text x="72" y="62" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="350" fill="#ffffff">product experience</text>
<text x="72" y="94" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="300" fill="#8f9bad">one dense command surface for intent, plan, approvals and live execution</text>
<line x1="72" y1="118" x2="1368" y2="118" stroke="#ffffff" stroke-opacity=".08"/>

<g transform="translate(58 145) rotate(-2 142.5 250.0)" filter="url(#shadow)">
  <rect x="14" y="20" width="285" height="500" rx="24" fill="#020305" opacity=".78"/>
  <rect x="7.0" y="7.0" width="285" height="500" rx="24" fill="#0b0f17" stroke="#9f7aea" stroke-opacity=".16"/>
  <rect width="285" height="500" rx="24" fill="url(#surface)" stroke="#ffffff" stroke-opacity=".09"/>
  <path d="M24 30 H261" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
  <text x="26" y="58" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500" fill="#9f7aea">navigation</text>
  <text x="26" y="91" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="350" fill="#ffffff">workspace</text>

  <rect x="26" y="106" width="120" height="28" rx="14" fill="#9f7aea" opacity=".12" stroke="#9f7aea" stroke-opacity=".18"/>
  <text x="86.0" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#9f7aea">new execution</text>
  <text x="26" y="160" font-family="Inter,Arial,sans-serif" font-size="12" fill="#778397">recent runs</text>
  <text x="259" y="160" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" fill="#d8dee9">12</text>
  <text x="26" y="191" font-family="Inter,Arial,sans-serif" font-size="12" fill="#778397">workflows</text>
  <text x="259" y="191" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" fill="#d8dee9">8</text>
  <text x="26" y="222" font-family="Inter,Arial,sans-serif" font-size="12" fill="#778397">agents</text>
  <text x="259" y="222" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" fill="#d8dee9">6</text>
  <text x="26" y="253" font-family="Inter,Arial,sans-serif" font-size="12" fill="#778397">connect</text>
  <text x="259" y="253" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" fill="#d8dee9">3 spaces</text>
  <text x="26" y="284" font-family="Inter,Arial,sans-serif" font-size="11" fill="#778397">usage</text>
  <rect x="26" y="294" width="233" height="8" rx="4" fill="#ffffff" opacity=".05"/>
  <rect x="26" y="294" width="144" height="8" rx="4" fill="#9f7aea" opacity=".75"/></g>
<g transform="translate(365 128) rotate(1 355.0 260.0)" filter="url(#shadow)">
  <rect x="14" y="20" width="710" height="520" rx="24" fill="#020305" opacity=".78"/>
  <rect x="7.0" y="7.0" width="710" height="520" rx="24" fill="#0b0f17" stroke="#5da8ff" stroke-opacity=".16"/>
  <rect width="710" height="520" rx="24" fill="url(#surface)" stroke="#ffffff" stroke-opacity=".09"/>
  <path d="M24 30 H686" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
  <text x="26" y="58" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500" fill="#5da8ff">command center</text>
  <text x="26" y="91" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="350" fill="#ffffff">what should cmdOS do?</text>

  <text x="26" y="122" font-family="Inter,Arial,sans-serif" font-size="12" fill="#778397">intent</text>
  <text x="684" y="122" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" fill="#d8dee9">prepare launch report</text>
  <text x="26" y="153" font-family="Inter,Arial,sans-serif" font-size="12" fill="#778397">plan</text>
  <text x="684" y="153" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" fill="#d8dee9">5 actions</text>
  <text x="26" y="184" font-family="Inter,Arial,sans-serif" font-size="12" fill="#778397">permission</text>
  <text x="684" y="184" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" fill="#d8dee9">1 required</text>
  <rect x="26" y="199" width="132" height="28" rx="14" fill="#5da8ff" opacity=".12" stroke="#5da8ff" stroke-opacity=".18"/>
  <text x="92.0" y="218" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#5da8ff">approve and run</text>
  <text x="26" y="253" font-family="Inter,Arial,sans-serif" font-size="11" fill="#778397">execution</text>
  <rect x="26" y="263" width="658" height="8" rx="4" fill="#ffffff" opacity=".05"/>
  <rect x="26" y="263" width="447" height="8" rx="4" fill="#5da8ff" opacity=".75"/>
  <text x="26" y="291" font-family="Inter,Arial,sans-serif" font-size="12" fill="#778397">result</text>
  <text x="684" y="291" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" fill="#d8dee9">waiting for verification</text></g>
<g transform="translate(1098 155) rotate(3 142.0 230.0)" filter="url(#shadow)">
  <rect x="14" y="20" width="284" height="460" rx="24" fill="#020305" opacity=".78"/>
  <rect x="7.0" y="7.0" width="284" height="460" rx="24" fill="#0b0f17" stroke="#2dd4bf" stroke-opacity=".16"/>
  <rect width="284" height="460" rx="24" fill="url(#surface)" stroke="#ffffff" stroke-opacity=".09"/>
  <path d="M24 30 H260" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
  <text x="26" y="58" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500" fill="#2dd4bf">runtime</text>
  <text x="26" y="91" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="350" fill="#ffffff">active agents</text>

  <text x="26" y="122" font-family="Inter,Arial,sans-serif" font-size="12" fill="#778397">planner</text>
  <text x="258" y="122" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" fill="#d8dee9">active</text>
  <text x="26" y="153" font-family="Inter,Arial,sans-serif" font-size="12" fill="#778397">mail agent</text>
  <text x="258" y="153" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" fill="#d8dee9">ready</text>
  <text x="26" y="184" font-family="Inter,Arial,sans-serif" font-size="12" fill="#778397">calendar</text>
  <text x="258" y="184" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" fill="#d8dee9">waiting</text>
  <text x="26" y="215" font-family="Inter,Arial,sans-serif" font-size="12" fill="#778397">verifier</text>
  <text x="258" y="215" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" fill="#d8dee9">idle</text>
  <text x="26" y="246" font-family="Inter,Arial,sans-serif" font-size="11" fill="#778397">system health</text>
  <rect x="26" y="256" width="232" height="8" rx="4" fill="#ffffff" opacity=".05"/>
  <rect x="26" y="256" width="213" height="8" rx="4" fill="#2dd4bf" opacity=".75"/></g>
</svg>