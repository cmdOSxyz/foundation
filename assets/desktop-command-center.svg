<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F8FAFC"/>
    <stop offset="0.52" stop-color="#F5F3FF"/>
    <stop offset="1" stop-color="#ECFEFF"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7C3AED"/>
    <stop offset="0.5" stop-color="#3B82F6"/>
    <stop offset="1" stop-color="#06B6D4"/>
  </linearGradient>
  <linearGradient id="accent2" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#A78BFA"/>
    <stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#64748B" flood-opacity=".18"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1400" height="640" rx="36" fill="url(#bg)"/>

<text x="700" y="46" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#111827">Desktop Command Center</text>
<g filter="url(#shadow)">
  <rect x="95" y="80" width="1210" height="500" rx="34" fill="#FFFFFF"/>
  <rect x="95" y="80" width="1210" height="56" rx="34" fill="#F8FAFC"/>
</g>
<circle cx="135" cy="108" r="7" fill="#F87171"/><circle cx="159" cy="108" r="7" fill="#FBBF24"/><circle cx="183" cy="108" r="7" fill="#34D399"/>
<rect x="120" y="160" width="205" height="395" rx="24" fill="#F8FAFC"/>
<rect x="350" y="160" width="595" height="395" rx="24" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="970" y="160" width="310" height="395" rx="24" fill="#F8FAFC"/>
<g font-family="Inter,Arial,sans-serif">
  <text x="150" y="205" font-size="18" font-weight="800" fill="#111827">cmdOS</text>
  <text x="150" y="250" font-size="13" font-weight="800" fill="#94A3B8">COMMAND</text>
  <rect x="140" y="270" width="165" height="42" rx="12" fill="#EDE9FE"/>
  <text x="165" y="297" font-size="15" font-weight="700" fill="#6D28D9">New execution</text>
  <text x="165" y="345" font-size="15" fill="#475569">Recent runs</text>
  <text x="165" y="390" font-size="15" fill="#475569">Workflows</text>
  <text x="165" y="435" font-size="15" fill="#475569">Agents</text>
  <text x="165" y="480" font-size="15" fill="#475569">Connect</text>

  <text x="385" y="205" font-size="14" font-weight="800" fill="#64748B">INTENT</text>
  <text x="385" y="245" font-size="27" font-weight="800" fill="#111827">Launch the release workflow</text>
  <rect x="385" y="275" width="525" height="85" rx="18" fill="#F8FAFC"/>
  <text x="410" y="310" font-size="15" fill="#334155">Check the build, prepare release notes,</text>
  <text x="410" y="337" font-size="15" fill="#334155">notify the team, and schedule deployment.</text>

  <text x="385" y="405" font-size="14" font-weight="800" fill="#64748B">EXECUTION PLAN</text>
  <rect x="385" y="430" width="525" height="84" rx="18" fill="#F5F3FF"/>
  <circle cx="415" cy="462" r="8" fill="#7C3AED"/>
  <text x="438" y="468" font-size="15" font-weight="700" fill="#111827">4 agents · 7 actions · 2 approvals</text>

  <text x="1005" y="205" font-size="14" font-weight="800" fill="#64748B">ACTIVE AGENTS</text>
  <circle cx="1018" cy="255" r="11" fill="#7C3AED"/><text x="1043" y="261" font-size="15" font-weight="700" fill="#111827">Planner</text>
  <circle cx="1018" cy="305" r="11" fill="#3B82F6"/><text x="1043" y="311" font-size="15" font-weight="700" fill="#111827">Release Agent</text>
  <circle cx="1018" cy="355" r="11" fill="#06B6D4"/><text x="1043" y="361" font-size="15" font-weight="700" fill="#111827">Verifier</text>
  <rect x="1000" y="430" width="245" height="58" rx="16" fill="url(#accent)"/>
  <text x="1122" y="466" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">Approve execution</text>
</g>
<circle r="7" fill="#7C3AED" filter="url(#glow)">
  <animateMotion dur="4.8s" repeatCount="indefinite" path="M390 535 C620 580, 830 580, 1120 535"/>
</circle>

</svg>